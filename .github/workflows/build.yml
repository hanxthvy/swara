name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux dibangun di dalam Ubuntu 22.04 supaya glibc yang dibutuhkan cukup
    # tua dan binary-nya jalan di distro lain. Runner terbaru memakai glibc
    # 2.43, dan hasilnya menolak jalan di mesin dengan glibc 2.41.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            asset: swara-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: swara-windows-x86_64.zip
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: swara-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            asset: swara-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Alat sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev build-essential curl ca-certificates

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Bangun rilis
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Paketkan (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="swara-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/swara" "$dist/"
          cp README.md LICENSE "$dist/"
          tar -czf "${{ matrix.asset }}" "$dist"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          # binari mentah juga diunggah, supaya bisa dijalankan tanpa ekstrak
          cp "target/${{ matrix.target }}/release/swara" "swara-${{ matrix.name }}"

      - name: Paketkan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "swara-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/swara.exe" "$dist/"
          Copy-Item README.md, LICENSE "$dist/"
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.asset }}" -Force
          (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" |
            Out-File -Encoding ascii "${{ matrix.asset }}.sha256"
          # binari mentah, bisa langsung diklik tanpa ekstrak
          Copy-Item "target/${{ matrix.target }}/release/swara.exe" "swara-${{ matrix.name }}.exe"

      - name: Paket .deb dan .rpm
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          arch=$(uname -m); [ "$arch" = "x86_64" ] && arch=amd64
          curl -fsSL -o /tmp/nfpm.tgz \
            https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          tar xzf /tmp/nfpm.tgz -C /tmp nfpm
          mkdir -p dist && cp "target/${{ matrix.target }}/release/swara" dist/swara
          VERSION="$ver" ARCH="$arch" /tmp/nfpm package -p deb -f packaging/nfpm.yaml -t .
          VERSION="$ver" ARCH="$arch" /tmp/nfpm package -p rpm -f packaging/nfpm.yaml -t .
          rm -rf dist
          shasum -a 256 swara_*.deb swara-*.rpm > paket.sha256

      - name: Unggah paket Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: paket-linux
          path: |
            swara_*.deb
            swara-*.rpm
            paket.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            swara-${{ matrix.name }}
            swara-${{ matrix.name }}.exe

  android:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner GitHub sudah punya SDK Android; jangan pakai setup-android karena
      # mencoba memasang paket "tools" yang sudah tidak ada dan gagal.
      - name: Alat Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(command -v sdkmanager)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # Kunci rilis Android. Tanpa kunci yang sama, pembaruan aplikasi tidak
      # bisa dipasang menimpa versi lama.
      - name: Siapkan keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/swara.jks"

      - name: Bangun APK
        env:
          SWARA_KEYSTORE: ${{ runner.temp }}/swara.jks
          SWARA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: sh android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/out/*.apk

  release:
    name: Rilis GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tulis catatan rilis
        run: |
          versi="${GITHUB_REF_NAME#v}"
          {
            echo "Pemutar musik YouTube Music native, satu binary tanpa browser."
            echo
            echo "| platform | berkas |"
            echo "|---|---|"
            echo "| Linux x86_64 | swara-linux-x86_64.tar.gz |"
            echo "| Linux Debian/Ubuntu | swara_\${versi}_amd64.deb |"
            echo "| Linux Fedora/openSUSE | swara-\${versi}-1.x86_64.rpm |"
            echo "| Windows x86_64 | swara-windows-x86_64.zip |"
            echo "| macOS Apple Silicon | swara-macos-arm64.tar.gz |"
            echo "| macOS Intel | swara-macos-x86_64.tar.gz |"
            echo "| Android 64-bit | swara-${versi}-arm64-v8a.apk |"
            echo "| Android 32-bit | swara-${versi}-armeabi-v7a.apk |"
            echo "| Android universal | swara-${versi}-universal.apk |"
            echo
            echo "Android: pasang APK-nya, izinkan \"instal dari sumber tak dikenal\""
            echo "sekali saja. Kalau ragu soal arsitektur HP, pakai yang universal."
            echo
            echo "Debian dan Ubuntu: \`sudo apt install ./swara_*.deb\`."
            echo "Fedora, RHEL, dan openSUSE: \`sudo dnf install ./swara-*.rpm\`."
            echo
            echo "Ekstrak, lalu jalankan \`swara\`. Di macOS pertama kali perlu"
            echo "\`xattr -dr com.apple.quarantine swara\` karena binary belum ditandatangani."
            echo
            echo "Binari mentah juga tersedia tanpa arsip: \`swara-windows-x86_64.exe\`,"
            echo "\`swara-linux-x86_64\`, \`swara-macos-arm64\`, \`swara-macos-x86_64\`."
            echo
            echo "Fitur akun (playlist dan lagu disukai) baru tersedia di Linux;"
            echo "di Windows dan macOS Swara tetap mencari dan memutar musik."
            echo
            echo "Sertakan berkas \`.sha256\` untuk memeriksa unduhan."
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/swara-linux-x86_64
            dist/swara-windows-x86_64.exe
            dist/swara-macos-arm64
            dist/swara-macos-x86_64
            dist/*.sha256
