[package]
name = "swara"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Pemutar musik native untuk YouTube Music, tanpa browser"
license = "MIT"
repository = "https://github.com/hanxthvy/swara"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19", features = ["symphonia-aac", "symphonia-isomp4"] }
# Nama box `mp4`/`m4a` untuk AAC polos (itag 140 tanpa container nyata).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "opt-simd"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
regex = "1"
sha1 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
