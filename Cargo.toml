[package]
name = "swara"
version = "0.2.2"
edition = "2021"
rust-version = "1.80"
description = "Pemutar musik native untuk YouTube Music, tanpa browser"
license = "MIT"
repository = "https://github.com/hanxthvy/swara"

[dependencies]
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19", features = ["symphonia-aac", "symphonia-isomp4"] }
# Nama box `mp4`/`m4a` untuk AAC polos (itag 140 tanpa container nyata).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "opt-simd"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
regex = "1"
sha1 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes = "0.8.4"
cbc = "0.1.2"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }

# Jendela: fitur Wayland/X11 hanya ada di Linux, kalau dipasang global build
# Windows dan macOS ikut gagal. MPRIS juga D-Bus, jadi Linux saja.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
mpris-server = "0.11"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
